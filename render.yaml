services:
  - type: web
    name: nfl-coaching-impact-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.lock && pip install --no-deps -e .
    startCommand: PYTHONPATH=src python -m uvicorn nfl_coaching_impact.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: nfl-coaching-impact-engine
    runtime: static
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter nfl-coaching-impact-web build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
